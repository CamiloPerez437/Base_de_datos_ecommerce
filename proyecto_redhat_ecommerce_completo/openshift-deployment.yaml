apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalstore-ecommerce
  labels:
    app: globalstore-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: globalstore-ecommerce
  template:
    metadata:
      labels:
        app: globalstore-ecommerce
    spec:
      containers:
      - name: globalstore-container
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: globalstore-service
spec:
  selector:
    app: globalstore-ecommerce
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: globalstore-route
spec:
  to:
    kind: Service
    name: globalstore-service
  port:
    targetPort: 80
